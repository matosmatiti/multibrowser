name: build
on: workflow_dispatch
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p logs resources
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Ядро подключений (sing-box)
        id: vpn
        env: {SINGBOX_VERSION: 1.13.12}
        run: |
          {
            curl -fsSL -o sb.zip "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-windows-amd64.zip"
            7z x sb.zip -osb -y
            cp sb/sing-box-${SINGBOX_VERSION}-windows-amd64/* resources/
            sha256sum sb.zip resources/sing-box.exe
          } 2>&1 | tee logs/1-vpn-tunnel.log
      - name: Движок
        id: engine
        run: node scripts/fetch-engine.mjs 2>&1 | tee logs/2-engine.log
      - name: Установка зависимостей
        id: npm
        run: npm install 2>&1 | tee logs/3-npm.log
      - name: Версия
        run: npm version "0.2.${{ github.run_number }}" --no-git-tag-version
      - name: Сборка и публикация в Releases
        id: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always -c.publish.owner=${{ github.repository_owner }} -c.publish.repo=${{ github.event.repository.name }} 2>&1 | tee logs/4-installer.log
      - uses: actions/upload-artifact@v4
        with: {name: MultiBrowser-Setup, path: dist/*.exe}
      - name: Готово
        run: |
          {
            echo "## Сборка успешна. Установщик лежит в разделе Releases справа на главной странице репозитория (и внизу этой страницы в Artifacts)."
            echo "SHA256 sing-box.exe (для проверки на VirusTotal): $(sha256sum resources/sing-box.exe | cut -d' ' -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Отчёт об ошибке
        if: failure()
        env:
          O1: ${{ steps.vpn.outcome }}
          O2: ${{ steps.engine.outcome }}
          O3: ${{ steps.npm.outcome }}
          O4: ${{ steps.dist.outcome }}
        run: |
          show() { if [ "$1" = failure ]; then echo "### $2"; echo '```'; tail -n 25 "$3"; echo '```'; fi; }
          {
            echo "## Сборка упала"
            show "$O1" "Ядро подключений" logs/1-vpn-tunnel.log
            show "$O2" "Движок" logs/2-engine.log
            show "$O3" "Зависимости" logs/3-npm.log
            show "$O4" "Установщик" logs/4-installer.log
          } >> "$GITHUB_STEP_SUMMARY"
