name: build
on:
  push:
    branches: [main, master]
    paths-ignore: ['**.md']
  workflow_dispatch:
concurrency:
  group: build
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p logs resources
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Ядро подключений (sing-box)
        id: vpn
        env: {SINGBOX_VERSION: 1.13.12}
        run: |
          {
            curl -fsSL -o sb.zip "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-windows-amd64.zip"
            7z x sb.zip -osb -y
            cp sb/sing-box-${SINGBOX_VERSION}-windows-amd64/* resources/
            sha256sum sb.zip resources/sing-box.exe
          } 2>&1 | tee logs/1-vpn-tunnel.log
      - name: Ядро AmneziaWG (sing-box-lx)
        id: lx
        env:
          GH_TOKEN: ${{ github.token }}
          LX_TAG: v1.13.13-lx.15
        run: |
          {
            mkdir -p lx
            gh release download "$LX_TAG" -R Leadaxe/sing-box-lx -p '*windows-amd64*.zip' -p 'SHA256SUMS' -D lx
            ls -la lx
            f=$(ls lx/*windows-amd64*.zip | head -1)
            n=$(basename "$f")
            if [ -f lx/SHA256SUMS ] && grep -q "$n" lx/SHA256SUMS; then (cd lx && grep "$n" SHA256SUMS | sha256sum -c -); else echo "Контрольная сумма для $n не найдена в SHA256SUMS (проверка пропущена)"; fi
            7z x "$f" -olx/ex -y
            cp "$(find lx/ex -name 'sing-box.exe' | head -1)" resources/sing-box-lx.exe
            sha256sum resources/sing-box-lx.exe
          } 2>&1 | tee logs/1b-lx-core.log
      - name: Движок
        id: engine
        run: node scripts/fetch-engine.mjs 2>&1 | tee logs/2-engine.log
      - name: Установка зависимостей
        id: npm
        run: npm install --ignore-scripts 2>&1 | tee logs/3-npm.log
      - name: Версия
        run: npm version "0.2.${{ github.run_number }}" --no-git-tag-version
      - name: Сборка и публикация в Releases
        id: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always -c.publish.owner=${{ github.repository_owner }} -c.publish.repo=${{ github.event.repository.name }} 2>&1 | tee logs/4-installer.log
      - uses: actions/upload-artifact@v4
        with: {name: MultiBrowser-Setup, path: dist/*.exe}
      - name: Готово
        run: |
          {
            echo "## Сборка успешна. Установщик лежит в разделе Releases справа на главной странице репозитория (и внизу этой страницы в Artifacts)."
            echo "SHA256 sing-box.exe (для проверки на VirusTotal): $(sha256sum resources/sing-box.exe | cut -d' ' -f1)"
            echo "SHA256 sing-box-lx.exe: $(sha256sum resources/sing-box-lx.exe | cut -d' ' -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Отчёт об ошибке
        if: failure()
        env:
          O1: ${{ steps.vpn.outcome }}
          O2: ${{ steps.engine.outcome }}
          O3: ${{ steps.npm.outcome }}
          O4: ${{ steps.dist.outcome }}
          O5: ${{ steps.lx.outcome }}
        run: |
          show() { if [ "$1" = failure ]; then echo "### $2"; echo '```'; tail -n 25 "$3"; echo '```'; fi; }
          {
            echo "## Сборка упала"
            show "$O1" "Ядро подключений" logs/1-vpn-tunnel.log
            show "$O5" "Ядро AmneziaWG" logs/1b-lx-core.log
            show "$O2" "Движок" logs/2-engine.log
            show "$O3" "Зависимости" logs/3-npm.log
            show "$O4" "Установщик" logs/4-installer.log
          } >> "$GITHUB_STEP_SUMMARY"
