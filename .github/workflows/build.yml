name: build
on: workflow_dispatch
jobs:
  win:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p logs resources
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-go@v5
        with: {go-version: '1.24'}
      - name: VPN-туннель (awg-wireproxy)
        env: {WIREPROXY_REF: v1.2.5}
        run: |
          {
            git clone --depth 1 --branch "$WIREPROXY_REF" https://github.com/bropines/awg-wireproxy.git wp
            cd wp
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o ../resources/wireproxy.exe ./cmd/wireproxy
          } 2>&1 | tee logs/1-vpn-tunnel.log
      - name: Движок
        run: node scripts/fetch-engine.mjs 2>&1 | tee logs/2-engine.log
      - name: Установка зависимостей
        run: npm install 2>&1 | tee logs/3-npm.log
      - name: Сборка установщика
        run: npm run dist 2>&1 | tee logs/4-installer.log
      - uses: actions/upload-artifact@v4
        with: {name: MultiBrowser-Setup, path: dist/*.exe}
      - name: Отчёт в Summary
        if: always()
        run: |
          {
            echo "## Результат сборки: ${{ job.status }}"
            for f in logs/*.log; do
              [ -f "$f" ] || continue
              echo "### $(basename "$f")"
              echo '```'
              tail -n 40 "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
