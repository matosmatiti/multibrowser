version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "electron"   # Electron обновляет workflow update-deps
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
