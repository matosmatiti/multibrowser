<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>MultiBrowser</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--p:#f1f3f8;--t:#1b1f2a;--m:#5b6478;--b:#dde1ea;--a:#2f6fe4;--h:#e3e7f0;--r:#d64545}
@media(prefers-color-scheme:dark){:root{--bg:#181c25;--p:#12151c;--t:#e6e9f0;--m:#8b93a5;--b:#2a3040;--a:#4c8dff;--h:#242a38;--r:#ff6b6b}}
html,body{margin:0;background:var(--bg);color:var(--t);font:13px/1.45 "Segoe UI",system-ui,sans-serif;user-select:none;overflow:hidden}
#c{box-sizing:border-box;border:1px solid var(--b);padding:0 0 16px;animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
#drag{height:26px;-webkit-app-region:drag;background:var(--p);border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 12px;color:var(--m);font-size:12px}
.row{display:flex;gap:14px;padding:18px 20px 6px}.ic{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--a);color:#fff}
.ic.error{background:var(--r)}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tx{min-width:0;flex:1}#msg{font-size:14px;font-weight:600;word-break:break-word;user-select:text}#det{color:var(--m);margin-top:6px;word-break:break-word;user-select:text}
#ac{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px 0}
button{font:inherit;color:var(--t);background:var(--p);border:1px solid var(--b);border-radius:8px;padding:6px 18px;cursor:pointer;transition:background .12s,transform .06s,filter .12s;-webkit-app-region:no-drag}
button:hover{background:var(--h)}button:active{transform:scale(.95)}button.d{background:var(--a);border-color:var(--a);color:#0b1220;font-weight:600}button.d:hover{background:var(--a);filter:brightness(1.12)}
button:focus-visible{outline:2px solid var(--a);outline-offset:1px}
</style></head><body><div id="c"><div id="drag"><span id="tt"></span></div>
<div class="row"><div class="ic" id="ic"></div><div class="tx"><div id="msg"></div><div id="det"></div></div></div><div id="ac"></div></div>
<script src="dialog.js"></script></body></html>
