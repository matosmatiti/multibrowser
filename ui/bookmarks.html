<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Закладки</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--p:#f3f4f7;--t:#1b1f2a;--m:#5b6478;--b:#d8dce6;--a:#2f6fe4;--g:#1a8f5a;--h:#e4e7ef}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--p:#181c25;--t:#e6e9f0;--m:#8b93a5;--b:#262b37;--a:#4c8dff;--g:#3ecf8e;--h:#222836}}
html,body{height:100%}body{margin:0;font:13px/1.4 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--t);display:flex}
aside{width:250px;flex:none;border-right:1px solid var(--b);background:var(--p);padding:14px;box-sizing:border-box;overflow:auto;display:flex;flex-direction:column;gap:6px}
main{flex:1;min-width:0;display:flex;flex-direction:column}h1{font-size:17px;margin:0 0 8px}
header{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--b);background:var(--p);flex-wrap:wrap}#q{flex:1;min-width:160px}
input,button,select{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--b);border-radius:6px;padding:6px 10px;box-sizing:border-box}
button.p{background:var(--a);border-color:var(--a);color:#0b1220;font-weight:600}
button{transition:background .12s,transform .06s,filter .12s;cursor:pointer}button:hover{background:var(--h)}button.p:hover{background:var(--a);filter:brightness(1.12)}button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--a);outline-offset:1px}input:hover{border-color:var(--a)}
input[type=checkbox]{accent-color:var(--a);width:16px;height:16px;cursor:pointer;padding:0}
.f{display:flex;align-items:center;gap:4px}.fb{flex:1;text-align:left;display:flex;justify-content:space-between;gap:8px;overflow:hidden}.fb span:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.fb.on{background:var(--h);border-color:var(--a)}.cnt{color:var(--m)}
.small{padding:3px 8px}.addf{display:flex;gap:6px;margin-top:6px}.addf input{flex:1;min-width:0}
#addbox,#bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--b);background:var(--p)}
.row{display:flex;gap:12px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--b)}.row:hover{background:var(--p)}.main2{min-width:0;flex:1}
.ttl{font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.m{color:var(--m);font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.act{display:flex;gap:6px;flex:none}
.tag{background:var(--p);border:1px solid var(--b);border-radius:9px;padding:0 8px;font-size:11px;color:var(--m);margin-left:6px}
.edit{display:grid;grid-template-columns:1fr 1fr 180px auto;gap:8px;flex:1}#none{padding:40px;text-align:center;color:var(--m)}#msg{color:var(--g);padding:0 16px;min-height:18px}[hidden]{display:none!important}
</style></head><body>
<aside><h1>Закладки</h1><div id="folders"></div><div class="addf"><input id="nf" placeholder="Новая папка" aria-label="Новая папка"><button id="nfb" title="Создать папку">+</button></div></aside>
<main>
<header><input id="q" type="search" placeholder="Поиск по закладкам…" aria-label="Поиск"><button class="p" id="add">+ Закладка</button><button id="imp">Импорт</button><button id="exp">Экспорт</button><button id="all">Выбрать все</button></header>
<div id="addbox" hidden><input id="at" placeholder="Название" aria-label="Название"><input id="au" placeholder="https://…" aria-label="Ссылка" size="34"><input id="af" list="fl" placeholder="Папка (необязательно)" aria-label="Папка"><button class="p" id="asave">Добавить</button><button id="acancel">Отмена</button></div>
<div id="bulk" hidden><span>Выбрано: <b id="cnt"></b></span><button id="bdel">Удалить</button><input id="mv" list="fl" placeholder="Папка…" aria-label="Папка для переноса" size="16"><button id="bmv">Переместить</button><button id="bopen">Открыть все</button><button id="bclr">Снять выбор</button></div>
<datalist id="fl"></datalist><div id="msg"></div>
<div id="list" style="overflow:auto;flex:1"></div><div id="none" hidden></div></main>
<script src="bookmarks.js"></script></body></html>
