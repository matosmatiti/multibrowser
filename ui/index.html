<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Профили</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--p:#f3f4f7;--t:#1b1f2a;--m:#5b6478;--b:#d8dce6;--a:#2f6fe4;--g:#1a8f5a;--h:#e4e7ef}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--p:#181c25;--t:#e6e9f0;--m:#8b93a5;--b:#262b37;--a:#4c8dff;--g:#3ecf8e;--h:#222836}}
body{margin:0;font:13px/1.4 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--t)}
header,#form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--b)}#form{background:var(--p)}
h1{font-size:18px;margin:0 12px 0 0}#q{flex:1;min-width:180px}
input,select,button{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--b);border-radius:6px;padding:6px 10px}
button.p{background:var(--a);border-color:var(--a);color:#0b1220;font-weight:600}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 16px;border-bottom:1px solid var(--b)}
th{color:var(--m);font-size:11px;font-weight:600}.on{color:var(--g)}.m{color:var(--m)}
.ic{display:inline-flex;width:28px;height:28px;border-radius:8px;align-items:center;justify-content:center;font-weight:700;color:#0b0f17;margin-right:10px;vertical-align:middle}
#none{padding:40px;text-align:center;color:var(--m)}
button{transition:background .12s,transform .06s,filter .12s;cursor:pointer}
button:hover:not(:disabled){background:var(--h)}
button.p:hover:not(:disabled){background:var(--a);filter:brightness(1.12)}
button:active:not(:disabled){transform:scale(.95);filter:brightness(.9)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--a);outline-offset:1px}
</style></head><body>
<header><h1>Профили</h1><input id="q" type="search" placeholder="Поиск по профилям…" aria-label="Поиск"><button class="p" id="new">+ Новый профиль</button></header>
<section id="form" hidden>
<input id="n" placeholder="Название профиля" aria-label="Название профиля">
<select id="mode" aria-label="Подключение"><option value="none">Без прокси</option><option value="proxy">Прокси</option><option value="vpn">VPN-конфиг (.conf)</option></select>
<span id="px" hidden><select id="ty" aria-label="Тип"><option>socks5</option><option>http</option></select> <input id="h" placeholder="host" size="14"> <input id="po" placeholder="порт" size="5"> <input id="us" placeholder="логин (необязательно)" size="16"> <input id="pw" type="password" placeholder="пароль" size="12"></span>
<button id="pick" hidden>Выбрать .conf</button><span id="cf" class="m"></span>
<button class="p" id="add">Создать</button><button id="cancel">Отмена</button>
</section>
<table><thead><tr><th>ПРОФИЛЬ</th><th>ПОДКЛЮЧЕНИЕ</th><th>УСИЛЕННЫЙ РЕЖИМ</th><th></th></tr></thead><tbody id="rows"></tbody></table>
<div id="none"></div>
<script src="renderer.js"></script></body></html>
