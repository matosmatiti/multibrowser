<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://ipinfo.io">
<title>Новая вкладка</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--p:#f3f4f7;--t:#1b1f2a;--m:#5b6478;--b:#d8dce6;--a:#2f6fe4}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--p:#181c25;--t:#e6e9f0;--m:#8b93a5;--b:#262b37;--a:#4c8dff}}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--t);font:14px/1.5 "Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
main{width:min(560px,92vw);text-align:center;animation:in .35s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ic{width:84px;height:84px;border-radius:22px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;color:#0b0f17;overflow:hidden}.ic img{width:100%;height:100%;object-fit:cover}
h1{margin:0;font-size:26px}.sub{color:var(--m);margin:4px 0 22px}
form{margin:0 0 22px}input{width:100%;box-sizing:border-box;padding:12px 18px;border-radius:26px;border:1px solid var(--b);background:var(--p);color:inherit;font:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
input:hover{border-color:var(--a)}input:focus{border-color:var(--a);box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 22%,transparent)}
.grid{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;text-align:left;background:var(--p);border:1px solid var(--b);border-radius:14px;padding:16px 20px}.grid div:nth-child(odd){color:var(--m)}
.m{color:var(--m);font-size:12px;margin-top:12px}
</style></head><body><main>
<div class="ic" id="ic"></div><h1 id="nm"></h1><div class="sub" id="conn"></div>
<form id="f"><input id="s" placeholder="Поиск или адрес сайта" autofocus aria-label="Поиск"></form>
<div class="grid"><div>IP-адрес</div><div id="ip">…</div><div>Страна</div><div id="cc">…</div><div>Город</div><div id="city">…</div><div>Часовой пояс</div><div id="tz">…</div><div>Провайдер</div><div id="org">…</div></div>
<div class="m" id="note">Данные определяются по IP-адресу, через который выходит этот профиль.</div></main>
<script src="start.js"></script></body></html>
