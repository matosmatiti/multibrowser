<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'"><title>История</title><style>
:root{color-scheme:light dark;--bg:#fff;--p:#f3f4f7;--t:#1b1f2a;--m:#5b6478;--b:#d8dce6;--a:#2f6fe4;--h:#e4e7ef}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--p:#181c25;--t:#e6e9f0;--m:#8b93a5;--b:#262b37;--a:#4c8dff;--h:#222836}}
body{margin:0;font:13px/1.4 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--b);background:var(--p)}h1{font-size:18px;margin:0 12px 0 0}#q{flex:1;min-width:160px}
input,button{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--b);border-radius:6px;padding:6px 10px}button.p{background:var(--a);border-color:var(--a);color:#0b1220;font-weight:600}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--b)}.main{min-width:0;flex:1}
.ttl{font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.m{color:var(--m);font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.act{display:flex;gap:6px;flex:none}
.day{padding:14px 16px 6px;font-weight:600;color:var(--m);font-size:12px}#none{padding:40px;text-align:center;color:var(--m)}
button{transition:background .12s,transform .06s,filter .12s;cursor:pointer}button:hover:not(:disabled){background:var(--h)}button.p:hover:not(:disabled){background:var(--a);filter:brightness(1.12)}button:active:not(:disabled){transform:scale(.95);filter:brightness(.9)}
button:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:1px}[hidden]{display:none!important}
</style></head><body>
<header><h1>История</h1><input id="q" type="search" placeholder="Поиск по истории…" aria-label="Поиск"><button id="rf">Обновить</button><button id="clr">Очистить всю историю</button></header>
<div id="list"></div><div id="none" hidden></div><script src="history.js"></script></body></html>
