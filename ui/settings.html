<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Настройки</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--p:#f3f4f7;--t:#1b1f2a;--m:#5b6478;--b:#d8dce6;--a:#2f6fe4;--g:#1a8f5a;--h:#e4e7ef}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--p:#181c25;--t:#e6e9f0;--m:#8b93a5;--b:#262b37;--a:#4c8dff;--g:#3ecf8e;--h:#222836}}
body{margin:0;font:13px/1.4 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--t)}
main{max-width:640px;margin:0 auto;padding:24px 20px}h1{font-size:18px;margin:0 0 16px}h2{font-size:12px;letter-spacing:.05em;color:var(--m);margin:24px 0 6px}
.r{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--b)}.r span.m{color:var(--m);display:block;font-size:12px}
input[type=text],select,button{font:inherit;color:var(--t);background:var(--p);border:1px solid var(--b);border-radius:6px;padding:6px 10px}
input[type=checkbox]{width:18px;height:18px}#ok{color:var(--g);float:right;font-size:12px;min-height:16px}
button{transition:background .12s,transform .06s,filter .12s;cursor:pointer}
button:hover:not(:disabled){background:var(--h)}
button.p:hover:not(:disabled){background:var(--a);filter:brightness(1.12)}
button:active:not(:disabled){transform:scale(.95);filter:brightness(.9)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--a);outline-offset:1px}
[hidden]{display:none!important}
</style></head><body><main>
<h1>Настройки <span id="ok"></span></h1>
<h2>ПОИСК И СТАРТ</h2>
<div class="r"><label for="search">Поисковая система</label><select id="search"><option value="google">Google</option><option value="duckduckgo">DuckDuckGo</option><option value="bing">Bing</option></select></div>
<div class="r"><label for="home">Стартовая страница новой вкладки</label><select id="home"><option value="google">Google</option><option value="blank">Пустая страница</option><option value="custom">Своя ссылка</option></select></div>
<div class="r" id="cr" hidden><label for="custom">Ссылка (https://…)</label><input type="text" id="custom" size="30"></div>
<h2>ВНЕШНИЙ ВИД</h2>
<div class="r"><label for="theme">Тема</label><select id="theme"><option value="system">Как в Windows</option><option value="light">Светлая</option><option value="dark">Тёмная</option></select></div>
<h2>ЗАКЛАДКИ И ИСТОРИЯ</h2>
<div class="r"><label for="bmBar">Показывать панель закладок</label><input type="checkbox" id="bmBar"></div>
<div class="r"><label for="keepHistory">Сохранять историю посещений</label><input type="checkbox" id="keepHistory"></div>
<h2>ЗАГРУЗКИ</h2>
<div class="r"><div>Папка загрузок по умолчанию<span class="m" id="ddv"></span></div><div><button id="dd">Выбрать…</button> <button id="ddr">Сбросить</button></div></div>
<h2>ЗАПУСК И ОБНОВЛЕНИЯ</h2>
<div class="r"><label for="restore">Восстанавливать вкладки и профили при запуске</label><input type="checkbox" id="restore"></div>
<div class="r"><label for="autoUpdate">Автоматически проверять обновления</label><input type="checkbox" id="autoUpdate"></div>
<div class="r"><div>Журнал работы (для диагностики)</div><button id="log">Показать файл</button></div>
<div class="r"><div>Версия <b id="ver"></b></div><button id="chk">Проверить обновления</button></div>
</main><script src="settings.js"></script></body></html>
