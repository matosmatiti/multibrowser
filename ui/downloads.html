<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Загрузки</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--p:#f3f4f7;--t:#1b1f2a;--m:#5b6478;--b:#d8dce6;--a:#2f6fe4;--h:#e4e7ef}
@media(prefers-color-scheme:dark){:root{--bg:#181c25;--p:#12151c;--t:#e6e9f0;--m:#8b93a5;--b:#2a3040;--a:#4c8dff;--h:#222836}}
html,body{height:100%}body{margin:0;font:13px/1.4 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--t);border:1px solid var(--b);box-sizing:border-box;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--b);font-weight:600}
#list{overflow:auto;flex:1}.it{padding:10px 12px;border-bottom:1px solid var(--b)}.nm{font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.m{color:var(--m);font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.bar{height:4px;background:var(--b);border-radius:2px;margin:6px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--a);transition:width .2s}
.act{display:flex;gap:6px;margin-top:6px}#none{padding:30px;text-align:center;color:var(--m)}
button{font:inherit;color:var(--t);background:var(--p);border:1px solid var(--b);border-radius:6px;padding:3px 10px}
button:disabled{opacity:.4}
button{transition:background .12s,transform .06s,filter .12s;cursor:pointer}button:hover:not(:disabled){background:var(--h)}button:active:not(:disabled){transform:scale(.95);filter:brightness(.9)}button:focus-visible{outline:2px solid var(--a);outline-offset:1px}
[hidden]{display:none!important}
</style></head><body>
<header><span>Загрузки</span><button id="clr">Очистить завершённые</button></header>
<div id="list"></div><div id="none" hidden>Загрузок пока нет</div>
<script src="downloads.js"></script></body></html>
